<body>

  <div id="profile">
    <div id="avatar">?</div>
    <div id="joinDate">Joined: —</div>
    <div id="usernameDisplay">—</div>
    <div id="passwordDisplay">Password: —</div>
  </div>

  <div id="centerBox">
    <div id="label">Enter User</div>
    <input id="userInput" type="text" placeholder="type a username..." autocomplete="off" autocapitalize="off" spellcheck="false" />
    <div id="result"></div>
  </div>

<script>
  const WORDS = ["nova","vexil","quark","zenith","orion","pixel","cobalt","raven",
    "flux","drift","ember","onyx","helix","prism","vertex","atlas","echo","lumen",
    "cipher","vector","solace","kernel","matrix","phantom","glitch","titan"];
  const THINGS = ["phone","machine","engine","robot","signal","circuit","node",
    "server","module","beacon","crystal","artifact","device","core","chip"];

  const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
  const pick = arr => arr[rand(0, arr.length - 1)];

  function genID() {
    const c = "ABCDEFGHJKLMNPQRSTUVWXYZ0123456789";
    let s = "";
    for (let i = 0; i < 8; i++) s += c[rand(0, c.length - 1)];
    return s;
  }
  function genPattern() {
    const t = rand(1, 3);
    if (t === 1) return { label: "WORD",   value: pick(WORDS) + "-" + pick(WORDS) };
    if (t === 2) return { label: "YEAR",   value: String(rand(1970, 2026)) };
    return { label: "NUMBER", value: String(rand(10000, 999999)) + "-" + pick(THINGS) };
  }
  function genPassword() {
    const c = "abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$";
    let s = "";
    for (let i = 0; i < 14; i++) s += c[rand(0, c.length - 1)];
    return s;
  }
  function genJoinDate() {
    const m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return m[rand(0,11)] + " " + rand(1,28) + ", " + rand(2018, 2026);
  }

  const input = document.getElementById("userInput");
  const result = document.getElementById("result");

  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && input.value.trim() !== "") {
      input.blur(); // hide mobile keyboard
      generate(input.value.trim());
    }
  });

  function generate(name) {
    result.innerHTML = "<span class='gen'>generating</span>...";
    setTimeout(() => {
      const id = genID();
      const pattern = genPattern();
      const password = genPassword();
      const joinDate = genJoinDate();

      document.getElementById("avatar").textContent = name.charAt(0).toUpperCase();
      document.getElementById("joinDate").textContent = "Joined: " + joinDate;
      document.getElementById("usernameDisplay").textContent = name;
      document.getElementById("passwordDisplay").textContent = "Password: " + password;
      document.getElementById("profile").style.display = "flex";

      result.innerHTML =
        "User ID: <span class='idc'>#" + id + "</span><br>" +
        pattern.label + ": <span class='pat'>" + pattern.value + "</span>";

      input.value = "";
      input.placeholder = "enter another user...";
    }, 700);
  }
</script>
